# imp3 smorf: smORFs (<= max_aa aa) of finished IMP3 samples, one job per sample
# (workflow/scripts/smorf/imp3_smorf.py). Outputs in imp/<sample>/Analysis/smORF/ and
# imp/<sample>/Analysis/annotation/annotation_CDS_RNA_hmms_smORF.gff.gz. imp3 smorf copies this file to
# <project>/smorf_config.yaml on the first run: edit it there. See docs/steps/smorf.md.

# where candidates come from
regions: "intergenic"     # intergenic: IMP3 CDS <= max_aa + new genes in the regions without an IMP3 feature;
                          # full: gene calling on the whole assembly (the smORF paper's pipeline)
occupied: "CDS tRNA tmRNA rRNA ncRNA CRISPR"   # IMP3 feature types that make a region genic
min_region: 30            # shortest region without a feature (nt)
flank: 0                  # nt of the neighbouring features added to both sides of a region (genes may overlap them)
imp3_cds: true            # IMP3 CDS <= max_aa (complete, not touching a contig end) as smORFs
max_aa: 100               # longest smORF (aa)

# pyrodigal-gv (metagenome mode, closed ends, masked N runs): [min_gene, max_overlap] of the two runs
default: [60, 60]         # genes >= 20 aa
small: [15, 15]           # small genes

# filters and statuses
antifam: true             # AntiFam (gathering cut-offs) on the new candidates; HMMs in <db>/smorf/AntiFam
min_upstream: 20          # nt upstream needed to assess the RBS motif (else rbs_status not_assessable)
paper: false              # with regions: full: the paper's RBS-motif, Rfam (cmscan --cut_tc) and Aragorn filters
                          # (reproduction; Rfam.cm pressed in <db>/smorf/Rfam)

# metaproteomic status: peptides after FDR, one file per sample ({sample} in the path) or one table with a sample
# column; validated with >= min_unique_peptides peptides found in the smORF and in no protein > max_aa aa
metap_peptides: ""
min_unique_peptides: 1
metap_background: []      # FASTA of further proteins (human proteome, contaminants); the IMP3 proteins are always used

# metaG / metaT reads per smORF (featureCounts on Assembly/<omic>.reads.sorted.bam): auto, true, false
read_support: "auto"
read_support_min_reads: 1

databases:                # "" = below <db_path>/smorf
  antifam_hmm: ""
  rfam_cm: ""
