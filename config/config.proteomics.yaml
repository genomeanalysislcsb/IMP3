raws: 
    Proteins: "sample.faa"
    ThermoRaw: ["thermo.raw"]
sample: "sample"
outputdir: ""
tmp_dir: "tmp"
db_path: "/data/idiv_biu/heintzbu/EXTDB/IMP_DBs"
mem:
    normal_mem_per_core_gb: 4
    big_mem_total_gb: 1600
    big_mem_cores: 8
    big_mem_per_core_gb: 200
searchgui:
    url: "http://genesis.ugent.be/maven2/eu/isas/searchgui/SearchGUI/{version}/SearchGUI-{version}-mac_and_linux.tar.gz"
    jar: "SearchGUI-{version}/SearchGUI-{version}.jar"
    version: "3.3.20"
    par:
        prec_tol: 10
        prec_ppm: 1
        frag_tol: 0.5
        frag_ppm: 0
        digestion: 0
        enzyme: "Trypsin"
        specificity: 0
        mc: 1
        fixed_mods: "Carbamidomethylation of C"
        variable_mods: "Oxidation of M"
        min_charge: 2
        max_charge: 4
        fi: "b"
        ri: "y"
        min_isotope: 0
        max_isotope: 1
        import_peptide_length_min: 7
        import_peptide_length_max: 50
        xtandem_noise_suppr: 0
        xtandem_quick_acetyl: 1
        xtandem_quick_pyro: 1
        xtandem_refine: 1
        msgf_instrument: 1
        msgf_fragmentation: 1
        msgf_protocol: 0
        msgf_min_pep_length: 7
        msgf_max_pep_length: 50
        msgf_num_ptms: 3
        comet_num_ptms: 3
peptideshaker:
    url: "http://genesis.ugent.be/maven2/eu/isas/peptideshaker/PeptideShaker/{version}/PeptideShaker-{version}.zip"
    jar: "PeptideShaker-{version}/PeptideShaker-{version}.jar"
    version: "1.16.45"
