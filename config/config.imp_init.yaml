steps: "preprocessing assembly analysis binning taxonomy summary"
email: ""
sessionName: ""
sessionKind: ""
settingsLocked: "false"
preprocessing_filtering: true
mem:
  normal_mem_per_core_gb: 8
  big_mem_total_gb: 180
  big_mem_cores: 5
  big_mem_per_core_gb: 36
tmp_dir: tmp
raws: 
  Metagenomics: "test/Reads/test.mg.1.fastq test/Reads/test.mg.2.fastq"
  Metatranscriptomics: ""
  LongReads: ""
  LongReadTech: ""
  Contigs: ""
  Alignment_metagenomics: ""
  Alignment_metatranscriptomics: ""
  Gff: ""
sample: test
outputdir: "IMP3.initialised"
summarydir: ""
summary_steps: "stats vis"
compress_level: "mid"
db_path: "../DBs"
trimmomatic:
  adapter: 
    mg: "TruSeq3-PE"
    mt: "TruSeq3-PE"
  leading: 20
  minlen: 40
  palindrome_clip_threshold: 30
  simple_clip_threshold: 10
  trailing: 20
  seed_mismatch: 2
  window_size: 1
  window_quality: 3
  strictness: 0.5
  target_length: 40
nextseq: false
filtering:
  filter: phiX174
sortmerna:
  files:
    - rfam-5.8s-database-id98
    - silva-arc-16s-id95
    - silva-bac-16s-id90
    - silva-euk-18s-id95
    - rfam-5s-database-id98
    - silva-arc-23s-id98
    - silva-bac-23s-id98
    - silva-euk-28s-id98
assembly: 
  hybrid: true
  assembler: megahit
  merge: "cap3" # how to do merge(assembly A, assembly B from reads not mapping to A); none or "" = use only assembly A
  mink: 25
  maxk: 99
  step: 4
  cap3:
    identity: 98
    overlap: 100
COGS: "COG0012 COG0018 COG0215 COG0525 COG0541 COG0016 COG0172 COG0495 COG0533 COG0552"
featureCountsStranding:
  mt: 2
  mg: 0
proteomics:
  filter_N_peptides: 2
  host_proteome: ""
  insert_variants: false
binning:
  binners: "MetaBAT binny"
  MetaBAT:
    cutoff: 1500
  binny:
    pk: 10
    nn: 4
  vizbin:
    dimension: 50
    kmer: 5
    perp: 30
    cutoff: 1000
annotation: "mantis"
krakendb: minikraken2
locked_normalMem: 0
locked_bigMem: 0
locked_bigCores: 0
locked_bigTotal: 0 
