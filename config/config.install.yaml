# Config file for IMP3 installation
# NOTE:
#   For data being retrieved from a git repository, the commit ID/hash has to be provided.
#   For more information on git commit hashes, see here: https://git-scm.com/book/en/v2/Git-Tools-Revision-Selection.

# path where to download/copy the data(bases)
#db_path: "/where/to/create/databases/"
db_path: "/mnt/lscratch/users/ohickl/databases/imp3"

##################################################
# Adapters for reads trimming
##################################################

# adapters from Trimmomatic
trimmomatic:
  url: "https://github.com/usadellab/Trimmomatic.git"
  commit: "e77bb89c70f60cb139393a22e89af47c5c1c69e8" # tag v0.39 (2021.11.15)

##################################################
# References for rRNA filtering
##################################################

# rRNA genes from SortMeRNA
sortmerna:
  url: "https://github.com/biocore/sortmerna.git"
  commit: "90cdf6ce459e9477c5d0de9a5daab025f49f3cc6" # tag v4.3.4 (2021.11.15)

##################################################
# References for reads filtering
##################################################
# NOTE: the downloaded and decompressed data should be a single file

genomes:
  # PhiX phage
  PhiX:
    url: "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/819/615/GCF_000819615.1_ViralProj14015/GCF_000819615.1_ViralProj14015_cds_from_genomic.fna.gz"
  # human genome
  GCF_000001405.38_GRCh38.p12:
    url: "ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/001/405/GCF_000001405.38_GRCh38.p12/GCF_000001405.38_GRCh38.p12_genomic.fna.gz"

##################################################
# Kraken2 databases for tax. analysis
##################################################
# NOTE: A kraken2 database has to have the following files: taxo.k2d, opts.k2d, hash.k2d
#       Reference: https://github.com/DerrickWood/kraken2/blob/master/docs/MANUAL.markdown#kraken-2-databases

kraken2:
 # kraken2 prebuild db based on GTDB 207 release ~400 GB
  struo2_gtdb_207:
    url: "http://ftp.tue.mpg.de/ebio/projects/struo2/GTDB_release207/kraken2"
#  # https://ccb.jhu.edu/software/kraken2/index.shtml?t=downloads
#  # Minikraken v2 (bacteria, archaea, viral libraries & human genome; 8 GB)
#  minikraken2:
#    url: "ftp://ftp.ccb.jhu.edu/pub/data/kraken2_dbs/old/minikraken2_v2_8GB_201904.tgz"
#  # https://benlangmead.github.io/aws-indexes/k2
#  # PlusPFP-8 (standard + protozoa, fungi & plant; 8 GB)
#  kraken_pfp8:
#    url: "https://genome-idx.s3.amazonaws.com/kraken/k2_pluspfp_8gb_20210517.tar.gz"

# GTDB-tk
gtdbtk:
  url: "https://data.ace.uq.edu.au/public/gtdb/data/releases/release207/207.0/auxillary_files/gtdbtk_r207_v2_data.tar.gz"

##################################################
# Mantis
##################################################
# https://github.com/PedroMTQ/mantis
# https://github.com/PedroMTQ/mantis/wiki/Configuration#setting-your-own-paths

mantis:
  # default HMMs (name/path mapping)
  default: # set paths null (i.e.: ncbi_ref_folder: null), if a database should not be used
    kofam_ref_folder: "/abs/path/to/imp3_dbs/mantis/kofam"
    ncbi_ref_folder: "/abs/path/to/imp3_dbs/mantis/ncbi"
    nog_ref_folder: "/abs/path/to/imp3_dbs/mantis/nog"
    pfam_ref_folder: "/abs/path/to/imp3_dbs/mantis/pfam"
    tcdb_ref_folder: "/abs/path/to/imp3_dbs/mantis/tcdb"
  # custom HMMs (list of paths)
  custom: [] # set to [] if not used otherwise provide at least one path
  # weights: format <name>_hmm_folder: <name>_weight
  weights:
    ncbi_weight: 0.9
    nog_weight: 0.8
    pfam_weight: 0.9
    uniprot_ec_weight: 0.9

binny:
  # Set only, if path to snakemake env is not the IMP3 default, i.e. the one created following the IMP3 install guide.
  # Default: ""
  snakemake_env_path: ""
