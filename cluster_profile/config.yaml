# config for execution on HPC cluster aion/iris using slurm

# NOTE: change all parameters with the tag "### USER_INPUT ####" !!!

# total number of cores and jobs
cores: 128
jobs: 50
# for local rules: use at most N cores of the host machine in parallel
local-cores: 1

# go on with independent jobs if a job fails
keep-going: True
# re-run all jobs the output of which is recognized as incomplete
rerun-incomplete: True
# print the reason for each executed rule
reason: True
# print out the shell commands that will be executed
printshellcmds: True
# conda
use-conda: True
# conda-prefix: "/mnt/isilon/projects/ecosystem_biology/local_tools/envs/imp3_devel" ### USER_INPUT ####
conda-prefix: "/mnt/aiongpfs/projects/imp/envs" ### USER_INPUT ####
# wait given seconds if an output file of a job is not present after the job finished
latency-wait: 60

# number of times to restart failing jobs
restart-times: 0
# script to check job status
cluster-status: '/mnt/aiongpfs/projects/imp/imp3/runscripts/status.py'
# cluster cancel command
cluster-cancel: 'scancel'
# execute snakemake rules with the given submit command
cluster: "{cluster.call} {cluster.runtime}{resources.runtime} {cluster.mem_per_cpu}{resources.mem_mb} \
          {cluster.threads}{threads} {cluster.qos} {cluster.nodes} {cluster.ntasks} {cluster.partition} \
          {cluster.clusters} {cluster.stdout} --parsable"
# slurm config (ABSOLUTE PATH !!!)
cluster-config: "/mnt/aiongpfs/projects/imp/imp3/config/slurm_simple_ul_hybrid_cluster.config.yaml" ### USER_INPUT ####
# max. number of cluster/drmaa jobs per second
max-jobs-per-second: 1
# max. number of job status checks per second
max-status-checks-per-second: 10

# misc
rerun-triggers: 'mtime'
verbose: True
