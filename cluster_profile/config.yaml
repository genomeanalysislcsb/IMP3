# config for execution on HPC cluster iris using slurm

# NOTE: change all parameters with the tag "USER_INPUT" !!!

# main workflow snakemake file
snakefile: "Snakefile"

# total number of cores and jobs
cores: 128
jobs: 5
# for local rules: use at most N cores of the host machine in parallel
local-cores: 1

# config file(s)
configfile:
  - "config/config.test.yaml" # USER_INPUT (in general, it should not be changed)

# resources
default-resources:
  # tmp directory
  - tmpdir="/abs/path/to/tmp_dir" # USER_INPUT

# go on with independent jobs if a job fails
keep-going: True
# re-run all jobs the output of which is recognized as incomplete
rerun-incomplete: True
# print the reason for each executed rule
reason: True
# print out the shell commands that will be executed
printshellcmds: True
# conda
use-conda: True
conda-prefix: "/abs/path/to/conda_dir" # USER_INPUT
# wait given seconds if an output file of a job is not present after the job finished
latency-wait: 60

# number of times to restart failing jobs
restart-times: 0
# execute snakemake rules with the given submit command
cluster: "{cluster.call} {cluster.runtime}{resources.runtime} {cluster.mem_per_cpu}{resources.mem} \
          {cluster.threads}{threads} {cluster.partition} {cluster.stdout}"
# slurm config (ABSOLUTE PATH !!!)
cluster-config: "/abs/path/to/imp3/config/slurm_simple.config.yaml" # USER_INPUT
# max. number of cluster/drmaa jobs per second
max-jobs-per-second: 1
# max. number of job status checks per second
max-status-checks-per-second: 10
