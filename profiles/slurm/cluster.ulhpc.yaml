# Slurm submission per IMP3 rule on the ULHPC (aion + iris, Slurm multi-cluster): bigmem rules on iris bigmem,
# COMEBin training on an iris GPU (volta). Copied from config/slurm_simple_ul_hybrid_cluster.config.yaml.
__default__:
  nodes: "--nodes 1-1"
  ntasks: "--ntasks 1"
  clusters: "--clusters 'aion'"
  partition: "--partition batch"
  qos: "--qos normal"
  account: ""
  call: "sbatch"
  mem_per_cpu: "--mem-per-cpu "
  runtime: "--time "
  threads: "--cpus-per-task "
  stdout: "--output logs_cluster_jobs/IMP3.{rule}.%j.stdout"

kraken_contigs:
  clusters: "--clusters 'iris'"
  partition: "--partition bigmem"

kraken_reads:
  clusters: "--clusters 'iris'"
  partition: "--partition bigmem"

kraken_reads_se:
  clusters: "--clusters 'iris'"
  partition: "--partition bigmem"

