# Snakemake 7 profile: every IMP3 rule is a Slurm job (generated by 'imp3 init'; edit freely)
cores: __CORES__                 # cores of all running jobs of one sample together
jobs: __JOBS__                   # jobs of one sample at the same time
local-cores: 1
keep-going: True
rerun-incomplete: True
reason: True
printshellcmds: True
use-conda: True
conda-prefix: "__CONDA_PREFIX__"
latency-wait: 60
restart-times: 0
rerun-triggers: 'mtime'
max-jobs-per-second: 1
max-status-checks-per-second: 10
# job state from sacct (works with and without Slurm multi-cluster)
cluster-status: "__IMP3_DIR__/runscripts/status.py"
cluster-cancel: "scancel"
# submission: memory per core (IMP3 cluster_specs), threads, runtime; partitions etc. per rule in cluster.yaml
cluster: "{cluster.call} {cluster.runtime}{resources.runtime} {cluster.mem_per_cpu}{resources.mem_mb} \
          {cluster.threads}{threads} {cluster.qos} {cluster.nodes} {cluster.ntasks} {cluster.partition} \
          {cluster.clusters} {cluster.account} {cluster.stdout} --parsable"
cluster-config: "__CLUSTER_CONFIG__"
