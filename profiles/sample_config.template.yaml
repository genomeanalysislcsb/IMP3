# IMP3 sample config template for 'imp3 run'. Placeholders, replaced per sample:
#   __SAMPLE__ sample id, __IMP_OUT__ <project>/imp, __IMP_DB__ db_path of imp3.yaml,
#   __MG_READS__ / __MT_READS__ the read files found for the sample (space-separated, R1 before R2).
# cluster_specs describe the Slurm nodes (memory per core); with executor local, imp3 run replaces them by the
# cores and memory of the machine. Adapt the lines marked ### USER_INPUT ####.
steps: "preprocessing assembly analysis binning taxonomy summary"
email: ""
sessionName: ""
sessionKind: ""
settingsLocked: "false"
preprocessing_filtering: true
cluster_specs:  ### USER_INPUT ####
  # Choose between: K, M, G, T
  mem_unit: "M"
  main_cluster:
    mem_total: 218624
    mem_per_core: 1708
    big_mem_total: 218624
    big_mem_cores: 128
    big_mem_per_core: 1708
    # Set maximum n cores to use for jobs
    cores_max: 128
    big_mem_cores_max: 128
  high_mem_cluster:
    mem_total: 126000
    mem_per_core: 4500
    big_mem_total: 2950000
    big_mem_cores: 112
    big_mem_per_core: 26339
    # Set maximum n cores to use for jobs
    cores_max: 28
    big_mem_cores_max: 28
tmp_dir: "/dev/shm/__SAMPLE__/tmp"  ### USER_INPUT ####
raws:
  Metagenomics: "__MG_READS__"  ### USER_INPUT ####
  Metatranscriptomics: "__MT_READS__"  ### USER_INPUT ####
  LongReads: ""
  LongReadTech: ""
  Contigs: ""
  Alignment_metagenomics: ""
  Alignment_metatranscriptomics: ""
  Gff: ""
sample: "__SAMPLE__"  ### USER_INPUT ####
outputdir: "__IMP_OUT__/__SAMPLE__"  ### USER_INPUT ####
summarydir: ""
# Options stats, vis
summary_steps: "stats"
mongo_user: "myUserAdmin"
mongo_port: 16626
mongo_password: "testMongo"
compress_level: "mid"
db_path: "__IMP_DB__"  ### USER_INPUT ####
# Read trimming and quality control
fastp:
  # Adapter trimming settings
  # Example Illumina TruSeq adapter sequences
  # R1: "AGATCGGAAGAGCACACGTCTGAACTCCAGTCA"
  # R2: "AGATCGGAAGAGCGTCGTGTAGGGAAAGAGTGT"
  adapter_trimming:
    mg:
      adapter_sequence_r1: "" # Leave blank to use autodetection
      adapter_sequence_r2: "" # Leave blank to use autodetection (or for it to be the same as r1)
      adapter_sequence_fasta: "" # Path to FASTA file for trimming (will be used for both r1 and r2 if specified)
    mt:
      adapter_sequence_r1: "" # Leave blank to use autodetection
      adapter_sequence_r2: "" # Leave blank to use autodetection (or for it to be the same as r1)
      adapter_sequence_fasta: "" # Path to FASTA file for trimming (will be used for both r1 and r2 if specified)
  # Quality filtering parameters
  quality_filtering:
    qualified_quality_phred: 15 # Base quality score threshold, default Q15
    unqualified_percent_limit: 40 # Max percent of unqualified bases, default 40%
    n_base_limit: 5 # Max number of 'N' bases, default 5
    average_qual: 0 # Minimum average quality score, default 0 (disabled)
    low_complexity_filter: true # Enable low complexity filter, default enabled
    complexity_threshold: 30 # Minimum complexity percentage, default 30%
  # PolyG tail trimming parameters
  polyG_tail_trimming:
    force_trim_poly_g: false # Force polyG tail trimming, enabled by default for NextSeq/NovaSeq
    poly_g_min_len: 10 # Minimum length to detect polyG in the read tail, default 10
    force_disable_trim_poly_g: false # Disable polyG tail trimming, even for NextSeq/NovaSeq
  # PolyX tail trimming parameters
  polyX_tail_trimming:
    trim_poly_x: false # Enable polyX trimming in 3' ends, disabled by default
    poly_x_min_len: 10 # Minimum length to detect polyX in the read tail, default 10
  # Global trimming parameters
  global_trimming:
    trim_front1: 0 # Trim how many bases in front of R1, default 0
    trim_tail1: 1 # Trim how many bases in tail of R1, default 1
    trim_front2: "" # Trim how many bases in front of R2, default empty and same as trim_front1
    trim_tail2: "" # Trim how many bases in tail of R2, default empty and same as trim_tail1
  # Per read cutting by quality options
  quality_cutting:
    cut_front: true # Enable sliding window from front, dropping bases if mean quality < threshold
    cut_tail: true # Enable sliding window from tail, dropping bases if mean quality < threshold
    cut_right: false # Enable sliding window from front to tail, dropping right part if mean quality < threshold, disabled by default. If enabled, `cut_tail` is not needed.
    cut_window_size: 1 # Window size for quality cutting, fastp default 4 (trimmoatic default 1)
    cut_mean_quality: 30 # Mean quality threshold for cutting, default Q20
    # Specific window sizes and mean quality for cut_front, cut_tail, and cut_right
    cut_front_window_size: 1 # Window size for cut_front, defaults to cut_window_size if not specified
    cut_front_mean_quality: 30 # Mean quality for cut_front, defaults to cut_mean_quality if not specified
    cut_tail_window_size: 1 # Window size for cut_tail, defaults to cut_window_size if not specified
    cut_tail_mean_quality: 30 # Mean quality for cut_tail, defaults to cut_mean_quality if not specified
    cut_right_window_size: 1 # Window size for cut_right, defaults to cut_window_size if not specified
    cut_right_mean_quality: 30 # Mean quality for cut_right, defaults to cut_mean_quality if not specified
  # Length filtering parameters
  length_filtering:
    length_required: 40 # Minimum read length to keep, default 40
    length_limit: 0 # Maximum read length to keep, default 0 (no limit)
  # Deduplicate reads
  deduplication: false # Default: false
  # Merging paired-end reads parameters
  merging:
    merge: false # Enable merging of overlapped paired-end reads, disabled by default
  # Base correction by overlap analysis parameters
  base_correction:
    correction: false # Enable base correction in overlapped regions, disabled by default
    overlap_len_require: 30 # Minimum length to detect overlapped region, default 30
    overlap_diff_limit: 5 # Maximum number of mismatched bases in overlap, default 5
    overlap_diff_percent_limit: 20 # Maximum percentage of mismatched bases in overlap, default 20%
  # Overrepresented sequence analysis parameters
  overrepresented_sequence_analysis:
    overrepresentation_analysis: true # Enable overrepresented sequence analysis, disabled by default
    overrepresentation_sampling: 20 # Sampling rate for overrepresented sequence analysis, default 20 (1 in 20 reads)
# Sequences to filter reads against
filtering:
  filter: "PhiX T2TCHM13v2genomic T2TCHM13v2transcripts"
# Keep rRNA reads in preprocessed reads
keep_rrnas: false
# Normalize read coverage for MT reads
read_coverage_normalization:
  normalize_read_coverage: false
  target_cov: 50
  min_cov: 2
# rRNA databases to use for filtering rRNA reads
sortmerna:
  files:
    - rfam-5.8s-database-id98
    - silva-arc-16s-id95
    - silva-bac-16s-id90
    - silva-euk-18s-id95
    - rfam-5s-database-id98
    - silva-arc-23s-id98
    - silva-bac-23s-id98
    - silva-euk-28s-id98
assembly: 
  hybrid: true
  assembler: megahit
  # how to do merge(assembly A, assembly B from reads not mapping to A);
  # none or "" = use only assembly A or choose between: concat, flye, cap3, quickmerge
  merge: "quickmerge" # quickmerge
  # kmer_list: defdault: 21,29,39,59,79,99,119,141 high-complexity preset: 27,37,47,57,67,77,87,97,107,117,127 
  kmer_list: 21,29,39,59,79,99,119,141
  mink: 25
  maxk: 99
  step: 4
  cap3:
    identity: 98
    overlap: 100
  quickmerge:
    min_overlap: 500
    # Default: 0
    len_cutoff: 0
    # Overlap cutoff used in selection of anchor contigs.
    # Ratio overlapping region/non-overlapping region (?).
    # Default: 5.0
    hco: 5.0
    # Overlap cutoff for contigs used for extension of the anchor contig
    # hco represents high confidence overlaps and used for seeding of the merging process.
    # 'c' is used to filter out overall alignments.
    # any alignment under 'c' will never be considered for merging.
    # so 'hco' is a subset of 'c'.
    # Default: 1.5
    c: 1.5
# mantis (default) / hmmer
annotation: "mantis"
mantis:
  # More lenient settings (default): --output_gff --verbose_kegg_matrix --domain_algorithm heuristic
  # More stringent defaults: --output_gff --verbose_kegg_matrix --domain_algorithm dfs --time_limit 180 --sorting_type bitscore --evalue_threshold 1e-6
  params: "--output_gff --verbose_kegg_matrix --domain_algorithm dfs --time_limit 180 --sorting_type bitscore --evalue_threshold 1e-6"
  # default HMMs
  # set to null (i.e.: ncbi_ref_folder: null), if no database, otherwise provide a path
  default:
    kofam_ref_folder: "__IMP_DB__/mantis/kofam"  ### USER_INPUT ####
    ncbi_ref_folder: "__IMP_DB__/mantis/ncbi"   ### USER_INPUT ####
    nog_ref_folder: "__IMP_DB__/mantis/nog"   ### USER_INPUT ####
    pfam_ref_folder: "__IMP_DB__/mantis/pfam"   ### USER_INPUT ####
    tcdb_ref_folder: "__IMP_DB__/mantis/tcdb"   ### USER_INPUT ####
  # custom HMMs (list)
  custom:
    # - "/path/to/custom/references/"
  # weights: <name>_hmm_folder --> <name>_weight
  weights:
    ncbi_weight: 0.9
    nog_weight: 0.8
    pfam_weight: 0.9
    uniprot_ec_weight: 0.9
# Choose between nothing and one or multiple of: KEGG essential Pfam_A Resfams Cas dbCAN metacyc SwissProt TIGRPFAM
# e.g. "KEGG essential Pfam_A"
hmm_DBs: ""
hmm_settings: 
  KEGG:
    cutoff: ""
    trim: "--trimall"
  essential:
    cutoff: "--cut_tc"
    trim: ""
  metacyc:
    cutoff: ""
    trim: "--trimall"
  Cas:
    cutoff: ""
    trim: ""
  Pfam_A:
    cutoff: "--cut_tc"
    trim: ""
  SwissProt:
    cutoff: ""
    trim: "--trimall"
  TIGRPFAM:
    cutoff: ""
    trim: ""
  dbCAN:
    cutoff: ""
    trim: ""
  Resfams:
    cutoff: ""
    trim: ""
# Choose between nothing and one or multiple of: COG0012 COG0018 COG0215 COG0525 COG0541 COG0016 COG0172 COG0495 COG0533 COG0552
# e.g. "COG0012 COG0018 COG0215"
COGS: "COG0012 COG0018 COG0215 COG0525 COG0541 COG0016 COG0172 COG0495 COG0533 COG0552"
featureCountsStranding:
  mt: 2
  mg: 0
proteomics:
  # Valid path to extra proteomes to add to the database in fasta format
  extra_proteomes: "__IMP_DB__/extra_proteomes/homo_sapiens_grch38p14_t2t_gb46_cauc_proteins.faa"  ### USER_INPUT ####
  # Maximum length of protein sequences to keep
  max_len: 40000
  # Minimum length of protein sequences to keep
  min_len: 6
  # Add proteomes of taxa identified in filtered Kraken report(s) (if NCBI has any)
  add_kraken_taxa_proteomes: false
  # Minimum read support for a taxon to be included in the proteome database
  min_read_support: 10
  # Path to CRAP common contaminants database
  crap_db: "__IMP_DB__/proteomics/20240515_CCP_cRAP.fasta"  ### USER_INPUT ####
binning:
  # Options: abawaca COMEBin CONCOCT binny MaxBin MetaBAT MetaDecoder SemiBin
  # NOTE: IMP supports a maximum of six binners only atm.
  binners: "COMEBin CONCOCT binny MetaBAT MetaDecoder SemiBin"
  abawaca:
    esom_min: 2500
    esom_max: 5000
  comebin:
    cutoff: 1000
  binny:
    kmers: '2,3,4'
    mask_disruptive_sequences: 'True'
    extract_scmags: 'True'
    coassembly_mode: 'auto'
    NX_value: 90
    min_cont_length_cutoff: 2250
    max_cont_length_cutoff: 2250
    min_cont_length_cutoff_marker: 2250
    max_cont_length_cutoff_marker: 2250
    max_n_contigs: 5.0e6
    # 0: 'domain', 1: 'phylum', 2: 'class', 3: 'order', 4: 'family', 5: 'genus', 6: 'species'
    max_marker_lineage_depth_lvl: 2
    distance_metric: 'manhattan'
    embedding:
      max_iterations: 50
    clustering:
      hdbscan_epsilon_range: '0.250,0.000'
      hdbscan_min_samples_range: '1,5,10'
      include_depth_initial: 'False'
      include_depth_main: 'False'
    bin_quality:
      min_completeness: 60
      start_completeness: 90
      purity: 95
  CONCOCT:
    cutoff: 500
  MaxBin:
    cutoff: 1000
  MetaBAT:
    # Minimum is 1500
    cutoff: 1500
  MetaDecoder:
    # Minimum is 2000
    cutoff: 2000
  SemiBin:
    # Choose between: global human_gut human_oral mouse_gut pig_gut dog_gut cat_gut wastewater ocean soil
    # leave empty to create my_built_environment and after use that as param
    model: 'human_gut'
    cutoff: 1500
  DAS_Tool:
    score_threshhold: 0.5
  MetaWrap:
    min_completeness: 60
    max_contamination: 10
kraken:
  confidence: 0.5
  krakendb: k2_core_nt_20250609  ### USER_INPUT ####
  report_minimizer: true
  min_hit_groups: 3
  # true: kraken2 --memory-mapping on a whole regular node; only if the database fits into its memory (core_nt,
  # ~280 GB, does not fit an aion node: keep false and the big-memory nodes)
  memory_mapping: false
  report_min_reads: 10
  report_min_unique_minimizers: 1000
bracken:
  # Choose from: D for Domain, P for Phylum, C for Class, O for Order, F for Family, G for Genus, S for Species
  # e.g. "D P C O F G S"
  # !!!! IF GTDB INDEX USE `R1` INSTEAD OF `D` !!!!
  levels: "R1 P C O F G S"
  min_reads: 10
# Default is 75, for MT might need to be reduced
motus:
  min_read_len_mg: 75
  min_read_len_mt: 75
  min_markers: 3
eukdetect:
  run_eukdetect: false
  eukdetect_dir: ../EukDetect
  database_dir: eukdetect_database_v1
  # eukdetect does not recommend pre-trimming, but I don't see why we should keep stuff we don't want
  min_readlen: 60
locked_normalMem: 0
locked_bigMem: 0
locked_bigCores: 0
locked_bigTotal: 0 
