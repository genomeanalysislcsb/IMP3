# Snakemake 7 profile: IMP3 on one machine (generated by 'imp3 init'; imp3 run adds --cores and --resources gpu=N)
cores: all
keep-going: True
rerun-incomplete: True
reason: True
printshellcmds: True
use-conda: True
conda-prefix: "__CONDA_PREFIX__"
latency-wait: 10
restart-times: 0
rerun-triggers: 'mtime'
