site_name: IMP3
site_url: https://genomeanalysislcsb.github.io/IMP3/
repo_url: https://github.com/genomeanalysislcsb/IMP3
repo_name: genomeanalysislcsb/IMP3
edit_uri: edit/main/docs/
site_description: Integrated metagenomic and metatranscriptomic analysis pipeline (Snakemake)
site_author: LCSB Systems Ecology and BioCore
copyright: LCSB BioCore, University of Luxembourg

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}

nav:
  - Home: index.md
  - Getting started:
      - Installation and test run: installation.md
      - Configuration: configuration.md
      - Running IMP3: running.md
  - Output files: outputs.md
  - Downstream tools: downstream.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
