</plots>


<links>

<link>
file          = data/essentialGenes.links.txt
radius        = 0.22r
color         = essential

# Curves look best when this value is small (e.g. 0.1r or 0r)
bezier_radius = 0r
thickness     = 1

# These parameters have default values. To unset them
# use 'undef'
#crest                = undef
#bezier_radius_purity = undef

# Limit how many links to read from file and draw
#record_limit  = 2000

</link>

</links>

<image>
  dir = .
  file = musttest.png
  svg = yes
  png = no

  # radius of inscribed circle in image
  radius = 1000p

  # by default angle=0 is at 3 o'clock position
  angle_offset      = -90

  auto_alpha_colors = yes
  auto_alpha_steps  = 5

  background = white
</image>
