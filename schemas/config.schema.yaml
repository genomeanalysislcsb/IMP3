$schema: "http://json-schema.org/draft-07/schema#"

description: IMP3 Snakemake configuration file

type: object

properties:
  input:
    type: object
    properties:
      sr:
        type: object
        properties:
          mg:
            type: object
            properties:
              r1:
                type: string
              r2:
                type: string
              se:
                type: string
          mt:
            type: object
            properties:
              r1:
                type: string
              r2:
                type: string
              se:
                type: string
      lr:
        type: object
        properties:
          mg:
            type: string
          mt:
            type: string
      assembly:
        type: object
        properties:
          contigs:
            type: string
          mapping:
            type: object
            properties:
              mg:
                type: string
              mt:
                type: string
          gff:
            type: string
  lr_tech:
    type: string
    enum:
      - none
      - ""
      - "nanopore"
      - "pacbio"
  sample:
    type: string
    # TODO: regular expression
  out_path:
    type: string
  db_path:
    type: string
  steps:
    type: array
  preprocessing:
    type: object
    properties:
      trimmomatic:
        type: object
        properties:
          adapter:
            type: object
            properties:
              mg:
                type: string
              mt:
                type: string
          seed_mismatch:
            type: number
            minimum: 0
          palindrome_clip_threshold:
            type: number
            minimum: 0
          simple_clip_threshold:
            type: number
            minimum: 0
          leading:
            type: number
            minimum: 0
          trailing:
            type: number
            minimum: 0
          minlen:
            type: number
            minimum: 0
          window_size:
            type: number
            minimum: 1
          window_quality:
            type: number
            minimum: 0
          strictness:
            type: number
          target_length:
            type: number
            minimum: 0
      nextseq:
        type: boolean
      filtering:
        type: object
        properties:
          genomes:
            type: array
          rrna:
            type: array
  assembly:
    type: object
    properties:
      hybrid:
        type: boolean
      assembler:
          type: string
          enum:
            - megahit
            - metaspades
      spades:
        type: object
        properties:
          metaspades:
            type: object
            properties:
              kmers:
                type: array
                # TODO: items
      megahit:
        type: object
        properties:
          mink:
            type: number
            minimum: 3
          maxk:
            type: number
            minimum: 3
          step:
            type: number
            minimum: 1
      merge:
        type: string
        enum:
          - null
          - ""
          - "concat"
          - "cap3"
          - "flye"
        default: "cap3"
      cap3:
        type: object
        properties:
          identity:
            type: number
            minimum: 1
            maximum: 100
          overlap:
            type: number
            minimum: 1
  analysis:
    type: object
    properties:
      hmm:
        type: array
        # TODO: items
      hmm_settings:
        type: object
      cogs:
        type: array
      featurecounts:
        type: object
        properties:
          stranded:
            type: object
            properties:
              mt:
                type: number
                minimum: 0
                maximum: 2
              mg:
                type: number
                minimum: 0
                maximum: 2
  binning:
    type: object
    properties:
      binners:
        type: array
      maxbin:
        type: object
        properties:
          cutoff:
            type: number
            minimum: 1
      metabat:
        type: object
        properties:
          cutoff:
            type: number
            minimum: 1500
      binny:
        type: object
        properties:
          pk:
            type: number
            minimum: 4
          nn:
            type: number
            minimum: 4
      vizbin:
        type: object
        properties:
          dimension:
            type: number
            minimum: 2
          kmer:
            type: number
            minimum: 2
          perp:
            type: number
            minimum: 1
          cutoff:
            type: number
            minimum: 1
  taxonomy:
    type: object
    properties:
      kraken2:
        type: object
        properties:
          db:
            type: string
      eukdetect:
        type: object
        properties:
          run:
            type: boolean
          db:
            type: string
          min_readlen:
            type: number
            min: 60
  summary:
    type: object
    properties:
      steps:
        type: array
        # TODO: items
      mongo_user:
        type: string
      mongo_port:
        type:
          # TODO: why string ???
          - string
          - number
      mongo_password:
        type: string
  proteomics:
    type: object
    properties:
      filter_n_peptides:
        type: number
        minimum: 1
      host_proteome:
        type: string
      insert_variants:
        type: boolean